openapi: "3.0.3"
info:
  title: C6 — API Gateway
  version: "0.1.0"
  description: >
    The customer-facing contract for the whole USDT BEP20->TRC20
    settlement corridor: quote -> order -> status -> webhook, plus an
    isolated sandbox exercising four deterministic failure triggers.
    See docs/03-build/c6-api-gateway-build-prompts.md for the full
    build spec this API implements. Customer-facing bearer auth (C6.1)
    is a distinct, separate concern from the service-to-service auth
    every other component in this corridor uses toward each other.

servers:
  - url: http://localhost:8087

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Healthz" }

  /readyz:
    get:
      summary: Readiness check (database reachable)
      security: []
      responses:
        "200":
          description: Ready.
        "503":
          description: Not ready.

  /metrics:
    get:
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: OK.
          content:
            text/plain:
              schema: { type: string }

  /v1/quotes:
    post:
      summary: Issue a time-locked price quote
      description: >
        Decision 5's own "quote-then-order, never quote-inside-order":
        the price a customer sees here is the exact row POST /v1/orders
        later reads back verbatim, never recomputed. Production
        customers only -- a sandbox API key gets 403 production_only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostQuoteRequest" }
      responses:
        "201":
          description: Quote issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "423":
          description: system_halted -- C1 is currently halted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/orders:
    post:
      summary: Create an order against a live, unexpired quote
      description: >
        The C1+C2 choreography ("Read this second" in the build spec):
        creates the order in C1, then assigns a deposit address via C2.
        If the second call fails, the order still comes back (status
        address_pending) rather than failing outright -- C6.4's
        reconciliation loop closes that gap asynchronously. Requires
        Idempotency-Key; production customers only.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostOrderRequest" }
      responses:
        "201":
          description: Order created (status created or address_pending).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: quote_expired, quote_already_consumed, or idempotency_conflict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: system_halted -- C1 is currently halted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/orders/{external_id}:
    get:
      summary: Pull-based order status (the webhook's own backstop)
      description: >
        Reads through to C1's own live state, translated into a
        defined customer-facing status -- never a passthrough of an
        internal state string this gateway hasn't been taught about.
        A suspended customer can still call this. Production customers
        only; a sandbox order's external_id is invisible here by
        construction (it lives in a separate table).
      parameters:
        - name: external_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sandbox/orders:
    post:
      summary: Create a sandbox order with a scripted, deterministic outcome
      description: >
        C6.7's own fully separate code path -- never touches real
        C1/C2/C4/C5 state. trigger selects which of the four documented
        scenarios (reorg, screening_hold, energy_exhaustion,
        retry_storm) this order deterministically plays out. Sandbox
        API keys only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostSandboxOrderRequest" }
      responses:
        "201":
          description: Sandbox order created, already in its scripted final state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/sandbox/orders/{external_id}:
    get:
      summary: Read back a sandbox order
      description: >
        Reads sandbox_orders only, never gateway_orders -- structurally
        cannot return production data. Sandbox API keys only.
      parameters:
        - name: external_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/retail/register:
    post:
      summary: Register a new end-user account (Model D's own B2C channel)
      description: >
        docs/01-strategy/model-d-model-f-product-separation.md's own 14
        Sep 2026 decision: a fully separate identity space from the B2B
        customers/API-key model above -- session tokens, never API
        keys. Only registered when a deployment sets
        GATEWAY_ENABLE_RETAIL=true; otherwise these routes 404.
        Auto-issues a session on success (auto-login on register).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetailCredentials" }
      responses:
        "201":
          description: Account created, session issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetailSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: email_taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/retail/login:
    post:
      summary: Log in, issuing a fresh session
      description: >
        invalid_credentials deliberately covers both "no such email"
        and "wrong password" -- never distinguished, closing the
        obvious account-enumeration side channel.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetailCredentials" }
      responses:
        "200":
          description: Session issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetailSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: invalid_credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: account_suspended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/retail/logout:
    post:
      summary: Revoke the current session
      description: Idempotent -- logging out an already-revoked session still succeeds.
      security: [{ retailBearerAuth: [] }]
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/RetailUnauthorized" }

  /v1/retail/me:
    get:
      summary: Confirm the current session's own identity
      security: [{ retailBearerAuth: [] }]
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetailMe" }
        "401": { $ref: "#/components/responses/RetailUnauthorized" }

  /v1/retail/quotes:
    post:
      summary: Issue a time-locked price quote (B2C)
      description: >
        Same quote-then-order discipline as POST /v1/quotes above,
        scoped to the authenticated end-user's own session instead of a
        B2B API key.
      security: [{ retailBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostQuoteRequest" }
      responses:
        "201":
          description: Quote issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/RetailUnauthorized" }
        "423":
          description: system_halted -- C1 is currently halted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/retail/orders:
    post:
      summary: Create an order against a live, unexpired quote (B2C)
      description: >
        Same C1+C2 choreography as POST /v1/orders above, scoped to the
        authenticated end-user's own session.
      security: [{ retailBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostOrderRequest" }
      responses:
        "201":
          description: Order created (status created or address_pending).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/RetailUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: quote_expired or quote_already_consumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: system_halted -- C1 is currently halted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/retail/orders/{external_id}:
    get:
      summary: Pull-based order status (B2C)
      description: >
        Reads through to C1's own live state, exactly like GET
        /v1/orders/{external_id} above. Ownership is checked, not just
        existence -- another end-user's external_id 404s, never leaks
        that the id exists. A B2B customer's order is equally invisible
        here, and vice versa -- the two identity spaces never leak into
        each other despite sharing the same underlying tables.
      security: [{ retailBearerAuth: [] }]
      parameters:
        - name: external_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/RetailUnauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        A customer's own sk_live_ (production) or sk_test_ (sandbox)
        API key -- the two are never interchangeable (invariant 4).
    retailBearerAuth:
      type: http
      scheme: bearer
      description: >
        An end-user's own rs_-prefixed session token, issued by
        POST /v1/retail/register or /login -- a fully separate
        credential space from bearerAuth's own B2B API keys. Never
        interchangeable with one; see
        docs/01-strategy/model-d-model-f-product-separation.md.

  responses:
    BadRequest:
      description: invalid_request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: customer_suspended, sandbox_only, or production_only.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The named resource does not exist (or belongs to a different customer -- ownership is checked, not just existence).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RetailUnauthorized:
      description: Missing, invalid, expired, or revoked session token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    Healthz:
      type: object
      properties:
        status: { type: string }
        version: { type: string }
        commit: { type: string }

    PostQuoteRequest:
      type: object
      required: [tier, amount_in, recipient_address]
      properties:
        tier: { type: string, enum: [DIRECT, STANDARD, SWEEP] }
        amount_in: { type: string, description: Decimal string, e.g. "3000.000000". }
        recipient_address: { type: string }

    Quote:
      type: object
      properties:
        quote_id: { type: integer, format: int64 }
        tier: { type: string, enum: [DIRECT, STANDARD, SWEEP] }
        amount_in: { type: string }
        amount_out: { type: string }
        fee_units: { type: string }
        network_fee_units: { type: string }
        recipient_address: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    PostOrderRequest:
      type: object
      required: [quote_id, external_id]
      properties:
        quote_id: { type: integer, format: int64 }
        external_id: { type: string }

    Order:
      type: object
      properties:
        external_id: { type: string }
        tier: { type: string, enum: [DIRECT, STANDARD, SWEEP] }
        amount_in: { type: string }
        amount_out: { type: string }
        fee_units: { type: string }
        network_fee_units: { type: string }
        recipient_address: { type: string }
        deposit_address: { type: string, nullable: true }
        status:
          type: string
          description: >
            address_pending or created (POST /v1/orders' own view);
            quoted, funded, screened, dispatching, settled, held,
            refunded, or expired (GET /v1/orders/{id}'s own view, once
            an address has been assigned).

    PostSandboxOrderRequest:
      type: object
      required: [tier, amount_in, recipient_address, trigger]
      properties:
        tier: { type: string, enum: [DIRECT, STANDARD, SWEEP] }
        amount_in: { type: string }
        recipient_address: { type: string }
        trigger:
          type: string
          enum: [reorg, screening_hold, energy_exhaustion, retry_storm]

    SandboxOrder:
      type: object
      properties:
        external_id: { type: string, description: Always sbx_ prefixed. }
        trigger:
          type: string
          enum: [reorg, screening_hold, energy_exhaustion, retry_storm]
        tier: { type: string, enum: [DIRECT, STANDARD, SWEEP] }
        amount_in: { type: string }
        amount_out: { type: string }
        fee_units: { type: string }
        network_fee_units: { type: string }
        recipient_address: { type: string }
        deposit_address: { type: string }
        state: { type: string }
        hold_reason: { type: string, nullable: true }
        webhook_attempts: { type: integer }
        webhook_exhausted: { type: boolean }

    RetailCredentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, description: At least 8 characters. }

    RetailSession:
      type: object
      properties:
        session_token: { type: string, description: "rs_-prefixed; present the exact string as a Bearer token on subsequent calls." }
        retail_customer_id: { type: integer, format: int64 }
        expires_at: { type: string, format: date-time }

    RetailMe:
      type: object
      properties:
        retail_customer_id: { type: integer, format: int64 }
        email: { type: string, format: email }
